  /v1/backup:
    get:
      summary: Export a gzipped tar backup bundle for an application
      operationId: exportBackup
      security:
        - BearerAuth: []
      parameters:
        - name: org_id
          in: query
          required: true
          schema:
            type: string
        - name: app
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Backup archive (`tar.gz`)
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /v1/restore:
    post:
