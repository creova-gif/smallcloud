      operationId: meterApp
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeterRequest"
      responses:
        "200":
          description: Updated application budget state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBudgetState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Monthly spend cap or org quota exceeded; returns current AppBudgetState.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBudgetState"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/org-quota:
    get:
