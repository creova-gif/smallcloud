name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run tests
        run: go test -race ./...

      - name: Run eval
        run: go run ./cli/cmd/smallcloud eval

      - name: Build release binaries
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build \
              -ldflags "-s -w -X github.com/creova-gif/smallcloud/cli.Version=${GITHUB_REF_NAME}" \
              -o "dist/smallcloud-${os}-${arch}" \
              ./cli/cmd/smallcloud
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum smallcloud-* > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/smallcloud-*
            dist/checksums.txt
