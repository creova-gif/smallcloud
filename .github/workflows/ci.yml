name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./... && go tool cover -func=coverage.out | tail -n 1 && rm -f coverage.out
      - name: Test FastAPI template
        run: python3 -m unittest -v templates/fastapi-sqlite/test_app.py
      - name: Test Node template
        run: node --test templates/node-sqlite/test_server.mjs
      - name: Eval
        run: go run ./cli/cmd/smallcloud eval
      - name: Build
        run: go build -ldflags "-X github.com/creova-gif/smallcloud/cli.Version=${GITHUB_REF_NAME:-dev}" -o /tmp/smallcloud ./cli/cmd/smallcloud
