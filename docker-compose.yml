services:
  smallcloud:
    image: golang:1.26-alpine
    working_dir: /app
    command: ["go", "run", "./cli/cmd/smallcloud", "serve", "--addr", "0.0.0.0:7420"]
    env_file:
      - path: .env.example
        required: true
      - path: .env
        required: false
    environment:
      SMALLCLOUD_STATE_DIR: /var/lib/smallcloud
      SMALLCLOUD_CADDY_ADMIN_URL: http://caddy:2019
    ports:
      - "127.0.0.1:7420:7420"
    volumes:
      - .:/app
      - smallcloud_state:/var/lib/smallcloud
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7420/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      smallcloud:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  smallcloud_state:
  caddy_data:
  caddy_config:
